version: 2
updates:
  # El ecosistema "npm" de Dependabot cubre también pnpm (detecta pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Vite: quedarse en 8.3.x → solo parches
      - dependency-name: 'vite'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

      # Storybook: quedarse en 10.6.x → solo parches
      - dependency-name: 'storybook'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@storybook/*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

      # Congelados en versión exacta
      - dependency-name: 'vitest'
        versions: ['>= 0']
      - dependency-name: '@vitest/*'
        versions: ['>= 0']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>= 0']
      - dependency-name: 'oxlint'
        versions: ['>= 0']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
