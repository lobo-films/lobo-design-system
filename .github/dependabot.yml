version: 2
updates:
  # El ecosistema "npm" de Dependabot cubre también pnpm (detecta pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Vite: quedarse en 8.3.x → solo parches
      - dependency-name: 'vite'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

      # Storybook: quedarse en 10.6.x → solo parches
      - dependency-name: 'storybook'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@storybook/*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@chromatic-com/storybook'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

      # Vitest: quedarse en 4.1.x → solo parches
      - dependency-name: 'vitest'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@vitest/*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

      # Playwright: quedarse en 1.63.x → solo parches (fija la revisión de Chromium)
      - dependency-name: 'playwright'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

      # Plugin de React: quedarse en 6.1.x → solo parches (minor coordinado con Vite)
      - dependency-name: '@vitejs/plugin-react'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

      # Oxlint: quedarse en 1.82.x → solo parches (los minors añaden reglas)
      - dependency-name: 'oxlint'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

    groups:
      # Paquetes que versionan en sincronía: sus parches llegan en un único PR
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'patch'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
        update-types:
          - 'patch'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
