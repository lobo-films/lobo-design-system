name: Branch name
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  title:
    runs-on: ubuntu-latest
    name: branch-name
    steps:
      - name: Branch name validation
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "$BRANCH" | grep -Eq '^((feature|bugfix|hotfix|docs|poc|arch)/LDS-[1-9][0-9]{0,3}(-[a-z0-9]+)*|dependabot/.+)$' \
            || { echo "::error::Invalid branch. Pattern: {type}/LDS-XXXX[-kebab-description]"; exit 1; }
