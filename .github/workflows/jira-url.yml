name: Jira URL
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
permissions:
  pull-requests: write
jobs:
  jira-url:
    runs-on: ubuntu-latest
    name: jira-url
    steps:
      - name: Fill Jira URL section in PR body
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: https://hipstha.atlassian.net/browse
        with:
          script: |
            const pr = context.payload.pull_request;
            // La clave sale de la rama (type/LDS-XXXX); el título es el respaldo
            const match = `${pr.head.ref} ${pr.title}`.match(/\bLDS-[1-9][0-9]{0,3}\b/);
            if (!match) {
              core.info('No Jira key found in branch or title, skipping');
              return;
            }

            const url = `${process.env.JIRA_BASE_URL}/${match[0]}`;
            const body = pr.body ?? '';
            const section = /(## Jira URL[^\S\n]*\n)[\s\S]*?(?=\n## |$)/;

            const newBody = section.test(body)
              ? body.replace(section, `$1\n${url}\n`)
              : `## Jira URL\n\n${url}\n\n${body}`;

            if (newBody === body) {
              core.info('Jira URL already up to date');
              return;
            }

            // Las ediciones hechas con GITHUB_TOKEN no disparan otro workflow, así que no hay bucle
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: newBody,
            });
            core.info(`Jira URL set to ${url}`);
